---
# cPanel/Laravel Cloud deployment configuration
# This file tells cPanel how to build and deploy your Laravel application

deployment:
  tasks:
    # Install PHP dependencies
    - export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
    - composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    
    # Generate application key (only if not set in environment)
    - php artisan key:generate --force --no-interaction
    
    # Run database migrations
    - php artisan migrate --force --no-interaction
    
    # Clear and cache config
    - php artisan config:clear
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    
    # Install and build frontend assets
    - npm ci --production=false
    - npm run build
    
    # Create storage link
    - php artisan storage:link --force
    
    # Optimize for production
    - php artisan optimize

# Optional: specify which branches to deploy
# branch: main

# Optional: pre-deployment commands
# pre_deployment:
#   - php artisan down --message="Deploying..." --retry=60

# Optional: post-deployment commands
# post_deployment:
#   - php artisan up
#   - php artisan queue:restart